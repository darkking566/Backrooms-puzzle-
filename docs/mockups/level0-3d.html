<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Backrooms 3D 技術展示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Serif+TC:wght@400&display=swap">
<style>
/* Layout: 3D stage fills the space above a fixed control bar; HUD chips top, narration bottom of stage. Single dark theme by design. */
:root {
  color-scheme: dark;
  --ink: #12110c;
  --panel: rgba(22, 20, 13, .86);
  --line: #403b27;
  --paper: #ebe3c4;
  --muted: #a39a78;
  --tube: #e6d36a;
  --warn: #c9573c;
  --f-ui: "IBM Plex Mono", ui-monospace, Menlo, "PingFang TC", "Microsoft JhengHei", monospace;
  --f-story: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--f-ui); overflow: hidden; }
#wrap { position: relative; height: 100%; display: flex; flex-direction: column; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.turn { position: absolute; top: 46%; transform: translateY(-50%); width: 44px; height: 64px; border-radius: 6px; background: rgba(22, 20, 13, .55); border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.turn small { font-size: 10px; color: var(--muted); }
.turn:hover { background: rgba(48, 44, 28, .85); }
.turn:disabled { opacity: .35; cursor: wait; }
#bL { left: max(8px, env(safe-area-inset-left, 0px)); }
#bR { right: max(8px, env(safe-area-inset-right, 0px)); }
.top { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.chip b { color: var(--tube); font-weight: 600; }
.chip.title { color: var(--paper); }
button.chip { pointer-events: auto; cursor: pointer; font: inherit; font-size: 11px; }
.bottom { position: absolute; left: 0; right: 0; bottom: 10px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.near { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.near:empty { display: none; }
.near button { pointer-events: auto; background: var(--panel); border: 1px solid var(--tube); color: var(--paper); border-radius: 5px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.near button span { color: var(--muted); font-size: 11px; }
.near button b { color: var(--tube); font-weight: 600; }
.say { pointer-events: none; max-width: min(38em, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-family: var(--f-story); font-size: 15px; line-height: 1.7; text-wrap: pretty; transition: opacity .4s; }
.say:empty { opacity: 0; }
.bar { flex: none; background: var(--ink); border-top: 1px solid var(--line); padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; }
.ctrl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; max-width: 560px; width: 100%; }
.ctrl button { background: var(--panel); border: 0; color: var(--paper); font: inherit; font-size: 13px; padding: 11px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ctrl button small { font-size: 10px; color: var(--muted); }
.ctrl button:hover { background: rgba(48, 44, 28, .95); }
.ctrl button[aria-pressed="true"] { color: var(--tube); }
.ctrl button:disabled { opacity: .45; cursor: wait; }
button:focus-visible { outline: 2px solid var(--tube); outline-offset: -2px; }
.lbl { position: absolute; transform: translate(-50%, -50%); background: rgba(18, 17, 12, .82); border: 1px dashed var(--tube); color: var(--tube); font-size: 11px; padding: 3px 8px; border-radius: 3px; pointer-events: none; white-space: nowrap; }
.end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; pointer-events: none; opacity: 0; transition: opacity 1.2s, background 1.2s; z-index: 5; }
.end.on { opacity: 1; background: rgba(12, 11, 7, .94); pointer-events: auto; }
.end h2 { font-family: var(--f-story); font-weight: 400; font-size: 24px; margin: 0; }
.end p { color: var(--muted); max-width: 30em; line-height: 1.7; margin: 0; font-size: 13px; }
.end button { background: var(--panel); border: 1px solid var(--tube); color: var(--tube); border-radius: 5px; padding: 10px 16px; font: inherit; cursor: pointer; }
.err { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
</style>

<div id="wrap">
  <div class="stage">
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <div class="top">
      <span class="chip title">技術展示 · Level 0</span>
      <span class="chip">移動 <b id="mv">0</b></span>
      <span class="chip">偏移 <b id="sh">0</b></span>
      <button class="chip" id="bQ">畫質 <b id="q">中</b><span id="qa">（自動）</span></button>
      <span class="chip">種子 <b id="sd">—</b></span>
    </div>
    <button class="turn" id="bL" aria-label="左轉">‹<small>左轉</small></button>
    <button class="turn" id="bR" aria-label="右轉">›<small>右轉</small></button>
    <div class="bottom"><div class="near" id="near"></div><div class="say" id="say"></div></div>
  </div>
  <div class="bar">
    <div class="ctrl">
      <button id="bBack">回頭<small>鏡頭外會偏移</small></button>
      <button id="bHint" aria-pressed="false">互動點<small>顯示可點處</small></button>
      <button id="bFlash" aria-pressed="false">閃爍<small>預設關閉</small></button>
      <button id="bSeed">換一個種子<small>重新生成</small></button>
    </div>
  </div>
  <div class="end" id="end"><h2>你撲進了閃爍的牆。</h2><p>技術展示到此結束。正式版會在這裡進入 Level 1。</p><button id="bAgain">重新開始</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
if (!window.THREE) { document.getElementById("wrap").innerHTML = '<div class="err">3D 函式庫沒有載入，請重新整理頁面。</div>'; return; }

/* ================= constants & helpers ================= */
const S = 4, H = 2.75, BACK = 1.35, EYE = 1.62, PITCH = -0.09;
const DV = [[0, -1], [1, 0], [0, 1], [-1, 0]];            // N E S W
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TIERS = { low: { name: "低", scale: .6, R: 4, res: 1, post: 0 }, mid: { name: "中", scale: .8, R: 6, res: .5, post: 1 }, high: { name: "高", scale: 1, R: 7, res: .34, post: 2 } };
let tier = "mid", autoQ = true, R = TIERS.mid.R;

let SEED = (Math.random() * 1e9) | 0;
function hash(...n) { let h = 2166136261 ^ SEED; for (const v of n) { h = Math.imul(h ^ (v | 0), 16777619); h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; } return (h >>> 0) / 4294967296; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ck = (i, j) => i + "," + j;

/* zones: fixed per seed, never shift. Near the start a few are placed on purpose so the demo shows each one. */
function zone(i, j) {
  if (i >= 2 && i <= 4 && j >= -5 && j <= -2) return "arch";
  if (i <= -2 && i >= -7 && j >= -6 && j <= 1) return "pillar";
  if (i >= -1 && i <= 1 && j >= -10 && j <= -7) return "dark";
  if (i >= 2 && i <= 4 && j >= 1 && j <= 3) return "pit";
  if (Math.abs(i) <= 1 && Math.abs(j) <= 1) return "hall";
  const n = hash(Math.floor(i / 5), Math.floor(j / 5), 77);
  return n < .1 ? "arch" : n < .24 ? "pillar" : n < .32 ? "dark" : n < .38 ? "pit" : "hall";
}
const stable = (i, j) => zone(i, j) === "arch";

/* ================= renderer & scene ================= */
const canvas = $("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" }); }
catch (e) { $("wrap").innerHTML = '<div class="err">這個瀏覽器無法使用 WebGL，3D 展示無法執行。</div>'; return; }
const scene = new THREE.Scene();
const FOGC = new THREE.Color(0x2b2613);
scene.background = FOGC; scene.fog = new THREE.FogExp2(FOGC, 0.062);
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 70);
camera.rotation.order = "YXZ";

/* ================= procedural textures ================= */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso; return t;
}
function noise(x, w, h, amt, rnd) { const d = x.getImageData(0, 0, w, h); for (let i = 0; i < d.data.length; i += 4) { const v = (rnd() - .5) * amt; d.data[i] += v; d.data[i + 1] += v; d.data[i + 2] += v * .8; } x.putImageData(d, 0, 0); }
function wallpaper(base, stripe, seed, stains) {
  return canvasTex(512, 352, (x, w, h) => {
    const r = mulberry(seed);
    x.fillStyle = base; x.fillRect(0, 0, w, h);
    for (let i = 0; i < w; i += 32) { x.fillStyle = stripe; x.fillRect(i, 0, 12, h); }
    x.fillStyle = "rgba(90,70,20,.10)";
    for (let i = 16; i < w; i += 32) for (let j = 10; j < h; j += 26) { x.beginPath(); x.moveTo(i, j - 5); x.lineTo(i + 4, j); x.lineTo(i, j + 5); x.lineTo(i - 4, j); x.fill(); }
    for (let k = 0; k < stains; k++) {
      const cx = r() * w, cy = h * (.55 + r() * .5), rad = 20 + r() * 90;
      const sg = x.createRadialGradient(cx, cy, 0, cx, cy, rad); sg.addColorStop(0, "rgba(95,70,20,.28)"); sg.addColorStop(.7, "rgba(110,85,25,.12)"); sg.addColorStop(1, "rgba(0,0,0,0)");
      x.fillStyle = sg; x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
    }
    noise(x, w, h, 22, r);
  });
}
const TEX = {
  walls: [0, 1, 2].map(k => wallpaper("#cdb75a", "rgba(225,205,120,.35)", 11 + k, 3 + k * 2)),
  pale: wallpaper("#d8d0a8", "rgba(240,232,200,.4)", 41, 2),
  carpet: canvasTex(256, 256, (x, w, h) => {        // tight Berber loops, seamless on all four edges
    const r = mulberry(5); x.fillStyle = "#94805a"; x.fillRect(0, 0, w, h);
    const loop = (cx, cy, rw, rh, col) => { for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) { x.fillStyle = col; x.beginPath(); x.ellipse(cx + ox, cy + oy, rw, rh, 0, 0, 7); x.fill(); } };
    for (let row = 0; row < 32; row++) for (let k = 0; k < 32; k++) {
      const cx = k * 8 + (row % 2) * 4 + (r() - .5) * 1.5, cy = row * 8 + (r() - .5) * 1.5;
      const v = r(); loop(cx, cy, 3.4, 2.6, v < .45 ? "rgba(70,55,30,.55)" : v < .8 ? "rgba(168,148,104,.6)" : "rgba(122,102,66,.6)");
      loop(cx - .6, cy - .7, 1.5, 1.1, "rgba(200,182,140,.35)");
    }
    noise(x, w, h, 26, r);
  }),
  ceil: canvasTex(256, 256, (x, w, h) => {
    const r = mulberry(9); x.fillStyle = "#d6d0ae"; x.fillRect(0, 0, w, h);
    for (let k = 0; k < 900; k++) { x.fillStyle = "rgba(90,80,50,.25)"; x.fillRect(r() * w, r() * h, 1.5, 1.5); }
    x.strokeStyle = "rgba(141,133,106,.55)"; x.lineWidth = 2; x.strokeRect(0, 0, w, h); x.beginPath(); x.moveTo(w / 2, 0); x.lineTo(w / 2, h); x.moveTo(0, h / 2); x.lineTo(w, h / 2); x.stroke();
    noise(x, w, h, 14, r);
  }),
  panel: canvasTex(128, 256, (x, w, h) => {
    x.fillStyle = "#fffbe6"; x.fillRect(0, 0, w, h);
    x.strokeStyle = "rgba(170,160,120,.55)"; x.lineWidth = 2; for (let i = 8; i < w; i += 10) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); } for (let j = 8; j < h; j += 10) { x.beginPath(); x.moveTo(0, j); x.lineTo(w, j); x.stroke(); }
    x.strokeStyle = "#b7ae8e"; x.lineWidth = 8; x.strokeRect(0, 0, w, h);
  }),
  tally: canvasTex(320, 200, (x, w, h) => {      // scratched tally marks: lighter plaster showing through the wallpaper
    const r = mulberry(1234); x.clearRect(0, 0, w, h); x.lineCap = "round";
    const scratch = (x0, y0, x1, y1) => {
      x.strokeStyle = "rgba(60,45,15,.55)"; x.lineWidth = 3.2; x.beginPath(); x.moveTo(x0 + 1.2, y0 + 1.2); x.lineTo(x1 + 1.2, y1 + 1.2); x.stroke();
      x.strokeStyle = "rgba(246,238,205,.95)"; x.lineWidth = 2; x.beginPath(); x.moveTo(x0, y0); x.quadraticCurveTo((x0 + x1) / 2 + (r() - .5) * 4, (y0 + y1) / 2, x1, y1); x.stroke();
    };
    let gx = 14, gy = 18;
    for (let g = 0; g < 11; g++) {
      const n = g === 10 ? 3 : 5;
      for (let k = 0; k < Math.min(n, 4); k++) { const xx = gx + k * 9 + (r() - .5) * 3; scratch(xx, gy + (r() - .5) * 4, xx + (r() - .5) * 5, gy + 44 + (r() - .5) * 5); }
      if (n === 5) scratch(gx - 5, gy + 34 + r() * 4, gx + 38, gy + 8 + r() * 4);
      gx += 58 + (r() - .5) * 6; if (gx > w - 50) { gx = 14 + r() * 8; gy += 62; }
    }
  }),
  figure: canvasTex(128, 320, (x, w, h) => {     // soft human silhouette for the peripheral shadow
    x.clearRect(0, 0, w, h); x.filter = "blur(6px)"; x.fillStyle = "rgba(6,5,2,1)";
    x.beginPath(); x.ellipse(w / 2, 52, 20, 25, 0, 0, 7); x.fill();
    x.beginPath(); x.moveTo(w / 2 - 34, 92); x.quadraticCurveTo(w / 2, 70, w / 2 + 34, 92); x.lineTo(w / 2 + 28, 210); x.lineTo(w / 2 + 18, 312); x.lineTo(w / 2 - 18, 312); x.lineTo(w / 2 - 28, 210); x.closePath(); x.fill();
  })
};

/* ================= light-grid shader ================= */
const LM = { tex: null, origin: new THREE.Vector2(), size: 1, data: null, n: 1 };
const shared = {
  uLM: { value: null }, uLMo: { value: LM.origin }, uLMs: { value: 1 },
  uCam: { value: new THREE.Vector3() }, uCamDir: { value: new THREE.Vector3() }, uTorch: { value: 0 }, uAmb: { value: .07 },
  uSeedOff: { value: new THREE.Vector2() }
};
const VERT = `
  varying vec2 vUv; varying vec3 vW; varying vec3 vN;
  #include <fog_pars_vertex>
  void main(){
    vUv = uv; vec4 p = vec4(position, 1.0); vec3 n = normal;
    #ifdef USE_INSTANCING
      p = instanceMatrix * p; n = mat3(instanceMatrix) * n;
    #endif
    vec4 w = modelMatrix * p; vW = w.xyz; vN = normalize(mat3(modelMatrix) * n);
    vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
  }`;
const FRAG = `
  uniform sampler2D map; uniform vec2 uRep; uniform vec3 uTint; uniform float uKind; uniform float uAlpha;
  uniform sampler2D uLM; uniform vec2 uLMo; uniform float uLMs; uniform vec3 uCam; uniform vec3 uCamDir; uniform float uTorch; uniform float uAmb; uniform vec2 uSeedOff;
  varying vec2 vUv; varying vec3 vW; varying vec3 vN;
  #include <fog_pars_fragment>
  float vh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vn(vec2 p){ vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
    return mix(mix(vh(i), vh(i + vec2(1.0, 0.0)), u.x), mix(vh(i + vec2(0.0, 1.0)), vh(i + vec2(1.0, 1.0)), u.x), u.y); }
  float fbm(vec2 p){ return vn(p) * .5 + vn(p * 2.07 + 7.1) * .3 + vn(p * 4.3 + 3.3) * .2; }
  void main(){
    vec4 tx = texture2D(map, vUv * uRep);
    vec3 base = tx.rgb * uTint;
    if (uKind < 0.5) {                                   // carpet: world-space so it never lines up with the cells
      vec2 w = vW.xz;
      vec3 a = texture2D(map, w * 0.85).rgb, b = texture2D(map, mat2(.8, -.6, .6, .8) * w * 0.61 + .37).rgb;
      base = mix(a, b, .5) * uTint;
      float damp = smoothstep(.5, .8, fbm(w * .21 + uSeedOff));
      base *= mix(vec3(1.0), vec3(.64, .57, .47), damp);
      base *= .86 + .28 * fbm(w * .045 + uSeedOff * 1.7);
    }
    vec2 sp = vW.xz + vN.xz * 0.3;                         // walls read the light just in front of them
    vec3 lm = texture2D(uLM, (sp - uLMo) / uLMs).rgb * 2.0;
    float h = clamp(vW.y / 2.75, 0.0, 1.0), k = 1.0;
    if (uKind > 0.5 && uKind < 1.5) k = mix(0.55, 1.05, h) * mix(0.62, 1.0, smoothstep(0.0, 0.4, vW.y)) * mix(1.0, 0.8, smoothstep(2.45, 2.75, vW.y));
    else if (uKind > 1.5 && uKind < 2.5) k = 0.4;
    vec3 L = lm * k + vec3(uAmb);
    vec3 tv = vW - uCam; float td = max(length(tv), 0.001);
    float torch = uTorch * smoothstep(0.72, 0.93, dot(tv / td, uCamDir)) * 4.0 / (1.0 + td * td * 0.22);
    L += vec3(1.0, 0.95, 0.85) * torch;
    if (uKind > 2.5 && uKind < 3.5) { base = vec3(0.13, 0.11, 0.06); L = lm * 0.55 + vec3(uAmb) + vec3(1.0,0.95,0.85) * torch * 2.4; }   // standing water
    if (uKind > 3.5) {                                   // pit walls: cut carpet at the rim, then dim earth fading to black with depth
      float dep = clamp(-vW.y / 1.4, 0.0, 1.0);
      vec3 rim = vW.y > -0.035 ? texture2D(map, vW.xz * 0.85).rgb * 0.75 : vec3(0.34, 0.28, 0.18);
      base = rim * (1.0 - smoothstep(0.0, 1.0, pow(dep, 0.55)));
      L = lm * mix(1.0, 0.2, dep) + vec3(uAmb) * (1.0 - dep) + vec3(1.0, 0.95, 0.85) * torch * (1.0 - dep);
    }
    gl_FragColor = vec4(base * L, uAlpha > 0.5 ? tx.a : 1.0);
    #include <fog_fragment>
  }`;
function litMat(tex, rep, kind, tint = [1, 1, 1], alpha = false) {
  return new THREE.ShaderMaterial({
    uniforms: Object.assign({ map: { value: tex }, uRep: { value: new THREE.Vector2(...rep) }, uTint: { value: new THREE.Vector3(...tint) }, uKind: { value: kind }, uAlpha: { value: alpha ? 1 : 0 } }, shared, THREE.UniformsLib.fog),
    vertexShader: VERT, fragmentShader: FRAG, fog: true, transparent: alpha, depthWrite: !alpha
  });
}
const MAT = {
  walls: TEX.walls.map(t => litMat(t, [1, 1], 1)),
  yellower: TEX.walls.map(t => litMat(t, [1, 1], 1, [1.04, 1.0, .86])),  // Level 311: just slightly more yellow
  pale: litMat(TEX.pale, [1, 1], 1),
  arch: litMat(TEX.pale, [1 / S, 1 / H], 1),
  pillar: litMat(TEX.walls[0], [.2, 1], 1),
  floor: litMat(TEX.carpet, [2, 2], 0),
  tile: litMat(TEX.carpet, [.5, .5], 0),
  ceil: litMat(TEX.ceil, [1, 1], 2),
  water: litMat(TEX.carpet, [1, 1], 3),
  pit: (() => { const m = litMat(TEX.carpet, [1, 1], 4); m.side = THREE.BackSide; return m; })(),
  tally: litMat(TEX.tally, [1, 1], 1, [1, 1, 1], true),
  panel: new THREE.MeshBasicMaterial({ map: TEX.panel }),
  dead: new THREE.MeshBasicMaterial({ color: 0x3b382b }),
  hole: new THREE.MeshBasicMaterial({ color: 0x050402, side: THREE.BackSide }),
  black: new THREE.MeshBasicMaterial({ color: 0x050402 }),
  flicker: new THREE.MeshBasicMaterial({ color: 0xfff6cf }),
  exit: new THREE.MeshBasicMaterial({ color: 0xe6d36a, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }),
  proxy: new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }),
  figure: new THREE.MeshBasicMaterial({ map: TEX.figure, transparent: true, opacity: .5, depthWrite: false })

}

/* ================= post-processing (old-photo look) ================= */
const rt = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const post = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) }, uQ: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; uniform float uQ; varying vec2 vUv;
    float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime) * 43758.5453); }
    void main(){
      vec2 uv = vUv, c = uv - .5, px = 1.0 / uRes; float r2 = dot(c,c);
      vec3 col = texture2D(tDiffuse, uv).rgb;
      if (uQ > 1.5) { vec2 ca = c * .006; col.r = texture2D(tDiffuse, uv + ca).r; col.b = texture2D(tDiffuse, uv - ca).b; }
      if (uQ > 0.5) {
        vec3 blur = (texture2D(tDiffuse, uv + px*vec2(1.5,0.)).rgb + texture2D(tDiffuse, uv - px*vec2(1.5,0.)).rgb + texture2D(tDiffuse, uv + px*vec2(0.,1.5)).rgb + texture2D(tDiffuse, uv - px*vec2(0.,1.5)).rgb) * .25;
        col = mix(col, blur, .35); col += max(blur - .72, 0.) * 1.6 * vec3(1., .95, .75);
      }
      col = 1. - exp(-col * 1.35);
      col *= vec3(1.06, 1.0, .80);
      float l = dot(col, vec3(.299,.587,.114)); col = mix(vec3(l), col, .82);
      col *= 1. - r2 * 1.25;
      col += (rnd(uv * uRes) - .5) * (uQ > 1.5 ? .07 : .09);
      gl_FragColor = vec4(col, 1.);
    }`,
  depthTest: false, depthWrite: false
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 1.5), T = TIERS[tier];
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w / h < .8 ? 78 : 68; camera.updateProjectionMatrix();
  rt.setSize(Math.max(2, Math.floor(w * dpr * T.scale)), Math.max(2, Math.floor(h * dpr * T.scale)));
  post.uniforms.uRes.value.set(rt.width, rt.height); post.uniforms.uQ.value = T.post;
  render();
}

/* ================= render ================= */
let flickT = 0, flickV = 1, torchTarget = 0;
const camDir = new THREE.Vector3();
function render(t = performance.now()) {
  if (flickerKey) {
    if (flash && !reduceMotion) { if (t - flickT > 70) { flickT = t; flickV = Math.random() < .3 ? .25 + Math.random() * .4 : 1; } }
    else flickV = reduceMotion ? .9 : .78 + .22 * Math.sin(t / 700);
    MAT.flicker.color.setRGB(flickV, flickV * .97, flickV * .82);
  }
  shared.uTorch.value += (torchTarget - shared.uTorch.value) * .2;
  camera.getWorldDirection(camDir); shared.uCam.value.copy(camera.position); shared.uCamDir.value.copy(camDir);
  post.uniforms.uTime.value = (t / 1000) % 100;
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); post.uniforms.tDiffuse.value = rt.texture; renderer.render(postScene, postCam);
  if (hints) placeLabels(); else $("labels").innerHTML = "";
}
let loopOn = false;
function loop(t) { if (!loopOn) return; render(t); requestAnimationFrame(loop); }
function setLoop(on) { if (on && !loopOn) { loopOn = true; requestAnimationFrame(loop); } else if (!on) loopOn = false; }
function needsLoop() { return (flickerKey && visibleSet().has(ck(...edgeCells(flickerKey)[0]))) || Math.abs(shared.uTorch.value - torchTarget) > .01; }

const v3 = new THREE.Vector3(), occRay = new THREE.Raycaster(), occDir = new THREE.Vector3();
function occluded(pos) {            // is a wall, pillar or arch between the camera and this point?
  occDir.subVectors(pos, camera.position); const dist = occDir.length(); occDir.divideScalar(dist);
  occRay.set(camera.position, occDir); occRay.far = dist - .2;
  return occRay.intersectObjects(blockers, false).length > 0;
}
function placeLabels() {
  const w = canvas.clientWidth, h = canvas.clientHeight; let html = ""; const seen = [];
  for (const p of pickables) {
    let text, pos;
    if (p.userData.exit) { text = "→ " + p.userData.exit.name; pos = v3.copy(p.position).setY(1.3); }
    else if (p.userData.flick) { text = "閃爍的牆"; pos = v3.copy(p.position).setY(1.5); }
    else if (p.userData.proxy) { text = "保溫瓶"; p.getWorldPosition(v3); v3.y += .5; pos = v3; }
    else if (p.userData.hot && !p.parent?.isGroup) { text = p.userData.hot.label; pos = v3.copy(p.position); }
    else continue;
    if (pos.distanceTo(camera.position) > 13) continue;
    const q = pos.clone().project(camera);
    if (q.z > 1 || Math.abs(q.x) > 1.02 || Math.abs(q.y) > 1.02) continue;
    if (occluded(pos)) continue;
    if (q.z > 1 || Math.abs(q.x) > 1.02 || Math.abs(q.y) > 1.02) continue;
    let sx = (q.x + 1) / 2 * w, sy = (1 - q.y) / 2 * h;
    for (const [ox, oy] of seen) if (Math.abs(ox - sx) < 70 && Math.abs(oy - sy) < 22) sy = oy + 24;   // nudge overlapping labels apart
    seen.push([sx, sy]);
    html += `<span class="lbl" style="left:${sx}px;top:${sy}px">${text}</span>`;
  }
  $("labels").innerHTML = html;
}

/* ================= motion ================= */
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
let frameTimes = [];
function tween(fromP, ctrlP, toP, fromY, toY, ms, done) {
  busy = true; setBusyButtons(true); setLoop(false);
  const t0 = performance.now(); let last = t0, fromX = camera.rotation.x; look.yaw = 0; look.pitch = 0;
  const step = now => {
    frameTimes.push(now - last); last = now;
    const k = Math.min(1, (now - t0) / ms), e = ease(k);
    const a = fromP.clone().lerp(ctrlP, e), b = ctrlP.clone().lerp(toP, e); camera.position.copy(a.lerp(b, e));
    camera.position.y = EYE + (reduceMotion ? 0 : Math.sin(e * Math.PI * 2) * .025);
    camera.rotation.y = fromY + (toY - fromY) * e; camera.rotation.x = fromX + (PITCH - fromX) * e;
    render(now);
    if (k < 1) requestAnimationFrame(step);
    else { busy = false; setBusyButtons(false); done(); autoQuality(); setLoop(needsLoop()); }
  };
  requestAnimationFrame(step);
}
function shortest(from, to) { let d = to - from; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return from + d; }
function clearFigure() { if (figure) { scene.remove(figure); figure = null; } }
function move(d, after) {
  $("near").innerHTML = ""; clearFigure();
  const ni = cur.i + DV[d][0], nj = cur.j + DV[d][1];
  const from = camera.position.clone(), to = stationPos(ni, nj, d), mid = new THREE.Vector3(cur.i * S, EYE, cur.j * S);
  const straight = d === cur.d, ctrl = straight ? from.clone().lerp(to, .5) : mid;
  const fy = camera.rotation.y, ty = shortest(fy, yawOf(d)), zonePrev = zone(cur.i, cur.j);
  ensureAround(ni, nj);
  cur = { i: ni, j: nj, d }; rebuild();   // build and light the destination before walking there
  torchTarget = zone(ni, nj) === "dark" ? 1 : 0;
  tween(from, ctrl, to, fy, ty, reduceMotion ? 1 : (straight ? 900 : 1050), () => {
    moves++; $("mv").textContent = moves;
    const z = zone(ni, nj);
    if (z !== zonePrev) say({ arch: "牆變成了淡色，開著一個個拱門。地毯深得會陷進去。這種地方據說不會偏移。", pillar: "一大片柱子，整齊得像格子一樣，一直排到看不見的地方。", dark: "燈全滅了。地上積著到腳踝的水，四周安靜得只剩你的呼吸。你打開了手電筒。", pit: "地上開始出現坑洞，一個一個排成格子。最好別靠太近。", hall: zonePrev === "dark" ? "嗡嗡聲回來了。你從來沒想過會想念它。你關掉了手電筒。" : "又是黃色的走廊。嗡嗡聲沒有停過。" }[z]);
    let changed = false;
    if (!reduceMotion && Math.random() < .35) changed = shiftUnseen() > 0;
    changed = maybeFlicker() || changed;
    maybeFigure();
    if (changed || figure) rebuild(); else rebuildExits();
    $("sh").textContent = shifted; render();
    if (after) after(); else if (itemsHere().length) say("腳邊有一個" + itemsHere()[0].name + "。");
  });
}
function turnAround() {
  clearFigure();
  const n = shiftUnseen(); $("sh").textContent = shifted;
  if (n) rebuild();
  const nd = (cur.d + 2) % 4;
  const from = camera.position.clone(), to = stationPos(cur.i, cur.j, nd), mid = new THREE.Vector3(cur.i * S, EYE, cur.j * S);
  const fy = camera.rotation.y, ty = fy + Math.PI;
  cur = { ...cur, d: nd };
  tween(from, mid, to, fy, ty, reduceMotion ? 1 : 1100, () => {
    say(stable(cur.i, cur.j) && n === 0 ? "你回頭看。拱門區沒有變，跟剛才一模一樣。" : n > 0 ? "你回頭看。剛才走過的路……不一樣了。" : "你回頭看。");
    rebuildExits(); render();
  });
}
function turnSide(dir) {          // dir: -1 left, +1 right — a 90° turn in place
  clearFigure(); $("near").innerHTML = "";
  let n = 0;
  if (!reduceMotion && Math.random() < .35) { n = shiftUnseen(); $("sh").textContent = shifted; if (n) rebuild(); }
  const nd = (cur.d + dir + 4) % 4;
  const from = camera.position.clone(), to = stationPos(cur.i, cur.j, nd), mid = new THREE.Vector3(cur.i * S, EYE, cur.j * S);
  const fy = camera.rotation.y, ty = shortest(fy, yawOf(nd));
  cur = { ...cur, d: nd };
  tween(from, from.clone().lerp(to, .5).lerp(mid, .5), to, fy, ty, reduceMotion ? 1 : 700, () => { rebuildExits(); render(); });
}
function maybeFlicker() {
  if (flickerKey || moves < 6) return false;
  let i = cur.i, j = cur.j;
  for (let s = 0; s < 4; s++) {
    const k = edgeKey(i, j, cur.d), t = edges.get(k);
    if (t === "wall" && s >= 1) { edges.set(k, "flicker"); flickerKey = k; say("走廊盡頭的牆在閃。不是燈在閃，是牆本身。"); return true; }
    if (!passable(t)) return false;
    i += DV[cur.d][0]; j += DV[cur.d][1];
  }
  return false;
}
function maybeFigure() {          // subtle sanity effect: a shadow far down a straight corridor, gone on the next look
  if (moves < 4 || Math.random() > .14 || zone(cur.i, cur.j) === "dark") return;
  let i = cur.i, j = cur.j, s = 0;
  while (s < 4 && passable(edgeAt(i, j, cur.d))) { i += DV[cur.d][0]; j += DV[cur.d][1]; s++; }
  if (s < 3) return;
  figure = new THREE.Mesh(GEO.figure, MAT.figure);
  figure.position.set(i * S + (hash(i, j, 5) - .5), 0, j * S + (hash(i, j, 6) - .5)); figure.rotation.y = yawOf(cur.d);
}

/* ================= quality ================= */
function setTier(t, auto) {
  const changedR = TIERS[t].R !== R; tier = t; autoQ = auto; R = TIERS[t].R;
  $("q").textContent = TIERS[t].name; $("qa").textContent = auto ? "（自動）" : "";
  if (changedR) ensureAround(cur.i, cur.j);
  rebuild(); resize();
}
function autoQuality() {
  if (!autoQ || frameTimes.length < 20) { frameTimes = []; return; }
  const ts = frameTimes.slice(5).sort((a, b) => a - b), med = ts[Math.floor(ts.length / 2)]; frameTimes = [];
  const want = med > 40 ? "low" : med < 20 ? "high" : "mid";
  const order = ["low", "mid", "high"], ci = order.indexOf(tier), wi = order.indexOf(want);
  const next = order[ci + Math.sign(wi - ci)];        // move one step at a time
  if (next !== tier) setTier(next, true);
}
$("bQ").onclick = () => { const order = ["low", "mid", "high", "auto"]; const idx = autoQ ? 3 : order.indexOf(tier); const n = order[(idx + 1) % 4]; if (n === "auto") setTier("mid", true); else setTier(n, false); };

/* ================= input ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const look = { yaw: 0, pitch: 0 };       // free look offset from the facing direction (drag to look around)
let downAt = null, dragging = false, lookStart = null;
canvas.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; dragging = false; lookStart = { ...look }; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
canvas.addEventListener("pointermove", e => {
  if (downAt && !busy) {
    const dx = e.clientX - downAt[0], dy = e.clientY - downAt[1];
    if (!dragging && Math.hypot(dx, dy) > 10) { dragging = true; canvas.style.cursor = "grabbing"; }
    if (dragging) {
      const k = 2.2 / Math.max(320, canvas.clientWidth);
      look.yaw = Math.max(-1.35, Math.min(1.35, lookStart.yaw + dx * k));
      look.pitch = Math.max(-.45, Math.min(.35, lookStart.pitch + dy * k));
      camera.rotation.y = yawOf(cur.d) + look.yaw; camera.rotation.x = PITCH + look.pitch;
      render(); return;
    }
  }
  if (e.pointerType === "mouse" && !busy) canvas.style.cursor = pick(e) ? "pointer" : "grab";
});
canvas.addEventListener("pointercancel", () => { downAt = null; dragging = false; });
canvas.addEventListener("pointerup", e => {
  const wasDrag = dragging; dragging = false; canvas.style.cursor = "grab";
  if (!downAt || wasDrag || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 10 || busy) { downAt = null; return; }
  downAt = null;
  const hit = pick(e); if (!hit) return;
  const u = hit.object.userData;
  if (u.exit) return move(u.exit.d);
  if (u.flick) { $("end").classList.add("on"); setLoop(false); return; }
  const h = u.hot;
  if (h.kind === "item") {
    const it = h.item, dx = it.i - cur.i, dz = it.j - cur.j;
    if (!dx && !dz) return pickUp(it);
    const d = DV.findIndex(v => v[0] === dx && v[1] === dz);
    if (d >= 0 && d !== (cur.d + 2) % 4 && passable(edgeAt(cur.i, cur.j, d))) return move(d, () => pickUp(it));
    return say("太遠了，得先走近一點。");
  }
  say(h.text);
});
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables.concat(blockers), false).filter(h => h.distance < 14);
  let exitHit = null;
  for (const h of hits) {            // items win over the invisible exit panels in front of them; walls stop the search
    const u = h.object.userData;
    if (u.hot) return h;
    if (u.exit || u.flick) { exitHit = exitHit || h; continue; }
    break;
  }
  return exitHit;
}

/* ================= UI ================= */
let sayTimer = 0;
function say(text) { const el = $("say"); el.textContent = text; clearTimeout(sayTimer); sayTimer = setTimeout(() => { el.textContent = ""; }, 8000); }
$("bBack").onclick = () => { if (!busy) turnAround(); };
$("bL").onclick = () => { if (!busy) turnSide(-1); };
$("bR").onclick = () => { if (!busy) turnSide(1); };
window.addEventListener("keydown", e => { if (busy || e.target.closest?.("input, textarea")) return; if (e.key === "ArrowLeft") turnSide(-1); else if (e.key === "ArrowRight") turnSide(1); else if (e.key === "ArrowDown") turnAround(); });
function setBusyButtons(b) { for (const id of ["bBack", "bL", "bR"]) $(id).disabled = b; }
$("bHint").onclick = () => { hints = !hints; $("bHint").setAttribute("aria-pressed", hints); MAT.exit.opacity = hints ? .13 : 0; render(); };
$("bFlash").onclick = () => { flash = !flash; $("bFlash").setAttribute("aria-pressed", flash); $("bFlash").querySelector("small").textContent = flash ? "已開啟" : "預設關閉"; render(); setLoop(needsLoop()); };
$("bSeed").onclick = () => { SEED = (Math.random() * 1e9) | 0; start(); };
$("bAgain").onclick = () => { $("end").classList.remove("on"); SEED = (Math.random() * 1e9) | 0; start(); };
window.addEventListener("resize", resize);

function start() {
  setLoop(false); clearFigure();
  cells.clear(); edges.clear(); picked.clear(); FIXED.clear();
  cur = { i: 0, j: 0, d: 0 }; moves = 0; shifted = 0; flickerKey = null; torchTarget = 0; shared.uTorch.value = 0;
  $("mv").textContent = 0; $("sh").textContent = 0; $("sd").textContent = SEED.toString(36).toUpperCase();
  shared.uSeedOff.value.set(hash(1, 2, 3) * 100, hash(4, 5, 6) * 100);
  edges.set(edgeKey(0, 0, 0), "open"); edges.set(edgeKey(0, -1, 0), "open"); edges.set(edgeKey(0, 0, 1), "open");
  edges.set(edgeKey(0, 0, 3), "wall"); edges.set(edgeKey(0, 0, 2), "wall"); edges.set(edgeKey(0, -1, 3), "wall");
  for (let j = -2; j >= -7; j--) edges.set(edgeKey(0, j, 0), "open");          // a straight run into the blackout zone ahead
  for (const k of edges.keys()) FIXED.add(k);
  ensureAround(0, 0);
  if (location.hash === "#pit") { edges.set(edgeKey(3, 0, 2), "open"); edges.set(edgeKey(3, 1, 2), "open"); cur = { i: 3, j: 0, d: 2 }; ensureAround(3, 0); }   // jump straight to the pit zone (for testing)
  camera.position.copy(stationPos(cur.i, cur.j, cur.d)); camera.rotation.set(PITCH, yawOf(cur.d), 0, "YXZ");
  rebuild(); resize();
  look.yaw = 0; look.pitch = 0;
  say("你在嗡嗡聲裡醒來。點畫面裡的開口就能走過去；按住畫面拖曳可以轉頭看四周，兩側的箭頭可以左轉、右轉。");
}
start();
})();
</script>
