<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backrooms 畫面樣稿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* Layout: one-screen game shell. Phone = stacked column; ≥900px = scene left, log/controls right. Deliberately single dark theme (fluorescent-at-night). */
:root {
  color-scheme: dark;
  --ink: #15140f;          /* page ground: unlit office */
  --panel: #1f1d15;        /* HUD panels */
  --panel-2: #2a271c;
  --line: #3d3926;
  --paper: #e9e1c3;        /* pale wallpaper — main text */
  --muted: #a39a78;
  --tube: #e6d36a;         /* fluorescent tube — accent */
  --tube-dim: #8f8240;
  --warn: #c9573c;
  --calm: #8fb3a3;         /* Manila Room piano */
  --f-ui: "IBM Plex Sans Condensed", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  --f-story: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--f-ui); font-size: 15px; overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--tube); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 1180px; margin: 0 auto;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }

/* Mockup bar (not part of the game) */
.mockbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px dashed var(--line); background: var(--ink); font-size: 12px; color: var(--muted); }
.mockbar .tag { font-family: var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--tube-dim); }
.mockbar select, .mockbar button { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; color: var(--paper); font-size: 12px; cursor: pointer; }
.mockbar .spacer { flex: 1; }
@media (max-width: 480px) { .mockbar .tag { display: none; } }
.mockbar button[aria-pressed="true"] { border-color: var(--tube-dim); color: var(--tube); }

main { flex: 1; min-height: 0; position: relative; }
.screen { position: absolute; inset: 0; overflow: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }

/* ---------- Title ---------- */
.title-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; }
.logo { font-family: var(--f-data); font-weight: 600; font-size: clamp(40px, 11vw, 84px); letter-spacing: .28em; color: var(--tube); text-shadow: 0 0 18px rgba(230,211,106,.35); margin-right: -.28em; }
.logo-sub { font-family: var(--f-data); color: var(--muted); letter-spacing: .3em; font-size: 12px; margin-top: -18px; }
.warnbox { max-width: 34em; border: 1px solid var(--warn); border-radius: 6px; padding: 14px 16px; text-align: left; font-size: 14px; line-height: 1.6; background: rgba(201,87,60,.08); }
.warnbox strong { color: var(--warn); display: block; margin-bottom: 4px; letter-spacing: .06em; }
.warnbox label { display: flex; gap: 8px; align-items: center; margin-top: 10px; cursor: pointer; color: var(--paper); }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(280px, 100%); }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; cursor: pointer; text-align: center; transition: border-color .15s, background .15s; }
.btn:hover:not(:disabled) { border-color: var(--tube-dim); background: var(--panel-2); }
.btn.primary { border-color: var(--tube-dim); color: var(--tube); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }

/* ---------- Prep / Death (narrow card screens) ---------- */
.narrow { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wake-count { font-family: var(--f-story); font-size: 22px; text-wrap: balance; }
.wake-count em { font-style: normal; color: var(--tube); font-family: var(--f-data); }
.kv { display: flex; justify-content: space-between; font-family: var(--f-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kv b { color: var(--paper); font-weight: 600; }
.weightbar { display: flex; gap: 3px; }
.weightbar i { flex: 1; height: 10px; border-radius: 2px; background: var(--panel-2); border: 1px solid var(--line); }
.weightbar i.on { background: var(--tube-dim); border-color: var(--tube-dim); }
.weightbar i.over { background: var(--warn); border-color: var(--warn); }
.shop { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.shop-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 11px 12px; border-top: 1px solid var(--line); background: var(--panel); cursor: pointer; text-align: left; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.shop-row:first-child { border-top: 0; }
.shop-row .box { width: 18px; height: 18px; border: 1px solid var(--muted); border-radius: 3px; display: grid; place-items: center; font-size: 12px; color: var(--ink); }
.shop-row[aria-pressed="true"] .box { background: var(--tube); border-color: var(--tube); }
.shop-row .nm { min-width: 0; }
.shop-row .nm small { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
.shop-row .cost { font-family: var(--f-data); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.shop-row.locked { cursor: not-allowed; opacity: .5; }
.note { font-size: 13px; color: var(--muted); line-height: 1.6; border-left: 2px solid var(--line); padding-left: 10px; }

.death-head { font-family: var(--f-story); font-size: 26px; text-align: center; padding-top: 10px; }
.cause { text-align: center; }
.cause .c1 { font-family: var(--f-data); color: var(--warn); letter-spacing: .08em; font-size: 13px; }
.cause .c2 { font-family: var(--f-story); color: var(--muted); margin-top: 6px; }
.ledger { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
.ledger .kv.total { border-top: 1px dashed var(--line); padding-top: 8px; color: var(--tube); }
.ledger .kv.total b { color: var(--tube); }
.corpse { font-family: var(--f-story); line-height: 1.7; color: var(--paper); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- Explore ---------- */
.explore { position: absolute; inset: 0; display: grid; grid-template-rows: auto auto minmax(0,1fr) auto auto; }
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.stat { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; cursor: pointer; }
.stat .g { font-family: var(--f-story); font-size: 13px; width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 3px; color: var(--paper); }
.stat .pips { display: flex; gap: 2px; }
.stat .pips i { width: 5px; height: 12px; background: var(--panel-2); border-radius: 1px; }
.stat .pips i.on { background: var(--paper); }
.stat.low .pips i.on { background: var(--warn); }
.hud .clock { margin-left: auto; font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.conds { width: 100%; display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
.conds span { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--warn); color: var(--warn); }
.conds:empty { display: none; }

.view { position: relative; width: 100%; aspect-ratio: 10 / 8; max-height: 52vh; margin: 0 auto; background: #000; overflow: hidden; touch-action: manipulation; display: flex; justify-content: center; }
.stage { position: relative; height: 100%; aspect-ratio: 10 / 8; max-width: 100%; overflow: hidden; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: absolute; inset: 0; pointer-events: none; transition: box-shadow .8s; }
.grain { position: absolute; inset: -20%; pointer-events: none; opacity: .09; mix-blend-mode: overlay; background-size: 160px 160px; animation: grain .9s steps(4) infinite; }
@keyframes grain { 0% { transform: translate(0,0) } 25% { transform: translate(-3%,2%) } 50% { transform: translate(2%,-3%) } 75% { transform: translate(-2%,-1%) } }
.hot { position: absolute; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; padding: 0; transition: border-color .2s, background .2s; }
.hot .lbl { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); white-space: nowrap; font-size: 11px; background: rgba(21,20,15,.88); color: var(--paper); padding: 2px 7px; border-radius: 3px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.hot.exit .lbl { bottom: auto; top: 50%; transform: translate(-50%,-50%); }
.hot:hover .lbl, .view.hints .hot .lbl { opacity: 1; }
.hot:hover, .view.hints .hot { border-color: rgba(233,225,195,.55); background: rgba(233,225,195,.06); }
.view.hints .hot.exit { border-style: dashed; }
.view.targeting .hot:not(.exit) { border-color: var(--tube); background: rgba(230,211,106,.12); }
.target-banner { position: absolute; left: 8px; right: 8px; top: 8px; background: rgba(21,20,15,.9); border: 1px solid var(--tube-dim); color: var(--tube); font-size: 12px; padding: 6px 10px; border-radius: 4px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.target-banner button { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; cursor: pointer; color: var(--paper); font-size: 12px; }
.caption { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-family: var(--f-data); font-size: 12px; color: var(--paper); background: rgba(0,0,0,.6); padding: 3px 10px; border-radius: 3px; white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.caption:empty { display: none; }
.caption.blur { filter: blur(1.2px); }

.logwrap { min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.log { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px 4px; font-family: var(--f-story); font-size: 15px; line-height: 1.75; display: flex; flex-direction: column; gap: 6px; }
.log p { margin: 0; color: var(--muted); }
.log p:last-child, .log p.fresh { color: var(--paper); }
.log p.sys { font-family: var(--f-data); font-size: 12px; color: var(--tube-dim); }
.log p.bad { color: var(--warn); }
.log p.calm { color: var(--calm); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 14px 10px; }
.choices:empty { display: none; }
.choice { background: var(--panel-2); border: 1px solid var(--tube-dim); color: var(--tube); border-radius: 5px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
.choice:hover { background: #343020; }

.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.actions button, .tabs button { background: var(--panel); border: 0; padding: 11px 4px; cursor: pointer; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.actions button small, .tabs button small { font-family: var(--f-data); font-size: 10px; color: var(--muted); }
.actions button:hover, .tabs button:hover { background: var(--panel-2); }
.actions button[aria-pressed="true"] { color: var(--tube); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: var(--ink); }

/* Sheets */
.sheet-back { position: absolute; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; z-index: 5; }
.sheet { width: 100%; max-height: 78%; background: var(--panel); border-top: 1px solid var(--tube-dim); border-radius: 12px 12px 0 0; display: flex; flex-direction: column; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .04em; }
.sheet-h button { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.sheet-b { overflow-y: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.slot { aspect-ratio: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; cursor: pointer; text-align: left; }
.slot[aria-pressed="true"] { border-color: var(--tube); }
.slot .w { font-family: var(--f-data); font-size: 10px; color: var(--muted); }
.slot .n { font-size: 13px; line-height: 1.3; }
.slot.empty { border-style: dashed; cursor: default; opacity: .4; }
.detail { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.detail p { margin: 0; font-family: var(--f-story); line-height: 1.7; }
.detail .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--muted); }
.subtabs button[aria-selected="true"] { color: var(--tube); border-bottom-color: var(--tube); }
.entry { border-left: 2px solid var(--line); padding: 2px 0 2px 10px; }
.entry h3 { margin: 0 0 2px; font-size: 14px; }
.entry p { margin: 0; font-family: var(--f-story); font-size: 14px; line-height: 1.7; color: var(--muted); }
.entry.q h3::before { content: "◇ "; color: var(--tube-dim); }
.entry.q.done h3::before { content: "◆ "; color: var(--tube); }
textarea { width: 100%; min-height: 120px; background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-family: var(--f-story); font-size: 14px; line-height: 1.7; resize: vertical; box-sizing: border-box; }
.mapc { width: 100%; aspect-ratio: 4 / 3; background: #e9e1c3; border-radius: 4px; display: block; }
.bodyrow { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: baseline; }
.bodyrow .g { font-family: var(--f-story); color: var(--muted); }
.bodyrow p { margin: 0; font-family: var(--f-story); line-height: 1.6; }

.modal { position: absolute; inset: 0; z-index: 8; background: rgba(10,10,6,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
.modal h2 { font-family: var(--f-story); font-weight: 400; font-size: 24px; margin: 0; text-wrap: balance; }
.modal p { color: var(--muted); max-width: 30em; line-height: 1.7; margin: 0; }

/* Desktop / landscape */
@media (min-width: 900px) {
  .explore { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0,1fr) auto auto; }
  .hud { grid-column: 1 / -1; }
  .view { grid-column: 1; grid-row: 2 / 5; max-height: none; height: 100%; aspect-ratio: auto; }
  .logwrap { grid-column: 2; grid-row: 2; border-left: 1px solid var(--line); }
  .actions { grid-column: 2; grid-row: 3; border-left: 1px solid var(--line); }
  .tabs { grid-column: 2; grid-row: 4; border-left: 1px solid var(--line); }
  .sheet-back { justify-content: flex-end; align-items: stretch; }
  .sheet { width: 400px; max-height: none; border-radius: 0; border-top: 0; border-left: 1px solid var(--tube-dim); }
}
@media (prefers-reduced-motion: reduce) { .grain { animation: none; } .vignette { transition: none; } }
</style>

<div id="app">
  <div class="mockbar">
    <span class="tag" data-t="mock">畫面樣稿</span>
    <select id="screenSel" aria-label="screen"></select>
    <span class="spacer"></span>
    <button id="flashBtn" aria-pressed="false"></button>
    <button id="soundBtn" aria-pressed="false"></button>
    <button id="langBtn">EN</button>
  </div>
  <main id="main"></main>
</div>

<script>
(() => {
"use strict";
/* ---------------- state ---------------- */
const S = {
  lang: "zh", screen: "title", flash: false, sound: false,
  node: "start", prev: null, moves: 0, minutes: 0,
  st: { water: 62, food: 48, rest: 70, mind: 74 },
  conds: [], inv: [], sel: null, targeting: null, hints: false,
  visited: {}, flags: {}, log: [], choices: [], sheet: null, sub: "clues",
  myNote: "", modal: null, points: 320, picked: { aw: 1, crow: 1 }
};
const L = (zh, en) => ({ zh, en });
const tx = v => (v && typeof v === "object" && "zh" in v) ? v[S.lang] : v;

/* ---------------- UI strings ---------------- */
const U = {
  mock: L("畫面樣稿", "Mockup"),
  flashOn: L("閃爍效果：開", "Flicker: on"), flashOff: L("閃爍效果：關", "Flicker: off"),
  soundOn: L("聲音：開", "Sound: on"), soundOff: L("聲音：關", "Sound: off"),
  scrTitle: L("1 標題畫面", "1 Title"), scrPrep: L("2 開局準備", "2 Loadout"), scrExplore: L("3 探索主畫面", "3 Explore"),
  scrBag: L("4 背包", "4 Backpack"), scrNotes: L("5 筆記本", "5 Notebook"), scrMap: L("6 地圖", "6 Map"),
  scrBody: L("7 身體狀態", "7 Body"), scrDeath: L("8 死亡結算", "8 Death summary"),
  sub: L("（暫定名稱）· 畫面樣稿", "(working title) · mockup"),
  warnT: L("光敏性癲癇警告", "PHOTOSENSITIVITY WARNING"),
  warnB: L("本遊戲包含閃爍的燈光效果。閃爍效果預設關閉，關閉時會改用穩定的光暈和文字提示。", "This game contains flickering lights. Flicker is off by default; when off, the game uses a steady glow and text cues instead."),
  warnC: L("開啟閃爍效果", "Enable flicker effects"),
  wake: L("醒來", "Wake up"), wakeS: L("進入開局準備", "Go to loadout"),
  cont: L("繼續", "Continue"), contS: L("沒有進行中的一局", "No run in progress"),
  codex: L("圖鑑", "Codex"), codexS: L("樣稿未包含", "Not in mockup"),
  credits: L("資料來源", "Sources"), creditsS: L("Backrooms Wiki · CC BY-SA 3.0", "Backrooms Wiki · CC BY-SA 3.0"),
  wakeN: L("第 <em>14</em> 次醒來", "Waking up for the <em>14th</em> time"),
  pts: L("可用點數", "Points available"), left: L("剩餘點數", "Points left"), load: L("負重", "Load"),
  prepNote: L("每局消耗：帶入的物品用掉就沒了。死亡時物品會留在遺體上，下一局找到遺體就能拿回一部分。", "Spent per run: carried items are gone once used. On death they stay on your body; find it next run to recover some."),
  locked: L("未解鎖", "Locked"), over: L("超過負重", "Over capacity"),
  died: L("你倒下了。", "You collapse."),
  surv: L("存活", "Survived"), reach: L("到達", "Reached"),
  total: L("合計", "Total"), again: L("再次醒來", "Wake again"),
  back: L("回頭", "Turn around"), backS: L("1 分", "1 min"),
  search: L("搜索", "Search"), searchS: L("30 分", "30 min"),
  rest: L("休息", "Rest"), restS: L("視地點", "varies"),
  hints: L("互動點", "Hotspots"), hintsS: L("顯示", "show"),
  bag: L("背包", "Backpack"), notes: L("筆記", "Notebook"), map: L("地圖", "Map"), body: L("身體", "Body"),
  close: L("關閉", "Close"),
  inspect: L("查看", "Inspect"), use: L("使用", "Use"), drink: L("喝", "Drink"), drop: L("丟棄", "Drop"),
  pickTarget: L("點選要使用「{x}」的目標", "Tap a target for “{x}”"), cancel: L("取消", "Cancel"),
  clues: L("線索", "Clues"), quests: L("任務", "Tasks"), mine: L("我的筆記", "My notes"),
  mineHelp: L("在曼尼拉房間寫下的筆記，下一局還會在桌上。其他地方寫的會被孤立效應抹掉。", "Notes written in the Manila Room stay on the table next run. Anywhere else, the Isolation Effect erases them."),
  mapHelp: L("沒在看的地方會偏移，地圖上越久沒去的區塊越淡。拱門區不會偏移，永遠清楚。", "Unobserved areas shift, so areas you left long ago fade. Arch rooms never shift and stay sharp."),
  noMap: L("你沒有紙筆，畫不了地圖。", "No pen and paper, so no map."),
  clock: L("時間 ??:??", "Time ??:??"), clockN: L("沒有手錶，只知道過了很久。", "No watch. Only that it has been a long time."),
  g_water: L("水", "H₂O"), g_food: L("食", "Fd"), g_rest: L("睡", "Zz"), g_mind: L("心", "Mn"),

let AC = null, humGain = null, pianoTimer = null;
function audioStart() {

      [[60, "sawtooth", .35], [120, "sine", .5], [180, "sine", .15]].forEach(([f, t, g]) => {

}

function audioUpdate() {
  if (!S.sound || !AC || S.screen !== "explore") { audioStop(); return; }
  const n = NODES[S.node];
  const hum = n.kind === "manila" ? 0 : S.node === "manila_near" ? .012 : S.node === "flicker" ? .05 : .03;
  humGain.gain.setTargetAtTime(hum, AC.currentTime, .4);
  const piano = n.kind === "manila" || S.node === "manila_near";
  if (piano && !pianoTimer) {
    const notes = [261.6, 311.1, 392, 466.2, 392, 311.1, 349.2, 293.7]; let i = 0;
    pianoTimer = setInterval(() => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle"; o.frequency.value = notes[i++ % notes.length];
      const vol = n.kind === "manila" ? .07 : .025;
      g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + 1.6);
      o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + 1.7);

    const ax = side === "left" ? a.x0 : a.x1, bx = side === "left" ? b.x0 : b.x1;
    quad(c, [[ax, a.y0], [bx, b.y0], [bx, b.y1], [ax, a.y1]], mix(P.wall, FOG, side === "left" ? .12 : .2));
    const p = (t, v) => [lerp(ax, bx, t), lerp(lerp(a.y0, b.y0, t), lerp(a.y1, b.y1, t), v)];
    quad(c, [p(.35, .38), p(.62, .4), p(.62, 1), p(.35, 1)], "#5a3a1e");
  }
  c.fillStyle = mix(P.wall, FOG, .05); c.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
  const dw = (b.x1 - b.x0) * .2, dh = (b.y1 - b.y0) * .7;
  c.fillStyle = "#5a3a1e"; c.fillRect(CX - dw / 2, b.y1 - dh, dw, dh);
  c.fillStyle = `rgba(255,250,215,${.35 + .4 * flickerLevel})`; c.fillRect(CX - dw / 2, b.y1 - 6, dw, 6);
  c.fillStyle = P.tube; c.fillRect(CX - 70, a.y0 + 40, 140, 18);
  // octagonal table + chairs
  const ty = CH * .66, tr = CW * .15;
  c.fillStyle = "#4a2e17"; c.beginPath();
  for (let i = 0; i < 8; i++) { const ang = Math.PI / 8 + i * Math.PI / 4; c.lineTo(CX + Math.cos(ang) * tr, ty + Math.sin(ang) * tr * .32); } c.closePath(); c.fill();
  c.fillStyle = "#2e1c0d"; c.fillRect(CX - tr * .55, ty + tr * .12, tr * 1.1, CH * .1);
  c.fillStyle = "#e9e1c3"; c.save(); c.translate(CX - 20, ty - 6); c.rotate(-.12); c.fillRect(0, 0, 46, 14); c.restore();
  c.fillStyle = "#3b2412"; c.fillRect(CX - tr * 1.6, ty - 90, 40, 160); c.fillRect(CX + tr * 1.35, ty - 90, 40, 160);
}
function drawScene() {
  const cv = $("#scene"); if (!cv) return;
  const c = cv.getContext("2d"); const n = NODES[S.node]; const P = palette(n.kind);
  c.clearRect(0, 0, CW, CH); c.fillStyle = FOG; c.fillRect(0, 0, CW, CH);
  if (n.kind === "arches") drawArches(c, n, P);
  else if (n.kind === "pillars") drawPillars(c, n, P);
  else if (n.kind === "manila") drawManila(c, n, P);
  else drawCorridor(c, n, P);
  if (S.node === "start" && !S.flags.bottle) {
    c.fillStyle = "#8d8f8a"; c.fillRect(CW * .59, CH * .82, 26, 58); c.fillStyle = "#5d5f5a"; c.fillRect(CW * .59, CH * .82, 26, 10);
  }
  // sanity: shadow figure at the edge
  if (S.st.mind < 45 && n.kind !== "manila") {
    c.fillStyle = "rgba(5,4,2,.55)"; const x = CW * .9, y = CY - 40;
    c.beginPath(); c.ellipse(x, y, 14, 18, 0, 0, 7); c.fill(); c.fillRect(x - 16, y + 14, 32, 120);
  }
}
function animate() {
  cancelAnimationFrame(rafId);
  const n = NODES[S.node];
  const needs = S.screen === "explore" && (S.node === "flicker" || n.kind === "manila");
  if (!needs) { flickerLevel = 1; drawScene(); return; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t0 = 0;
  const step = t => {
    if (S.flash && !reduce) { if (t - t0 > 70) { t0 = t; flickerLevel = Math.random() < .25 ? .15 + Math.random() * .3 : 1; } }
    else flickerLevel = reduce ? .8 : .75 + .25 * Math.sin(t / 900);
    drawScene(); rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}

/* exits → hotspot rectangles in canvas coords */
function exitRect(n, ex) {
  if (ex.side === "front") { const e = G(n.depth || 4); return { x: e.x0, y: e.y0, w: e.x1 - e.x0, h: e.y1 - e.y0 }; }
  if (ex.side === "left" || ex.side === "right") {
    const a = G(ex.seg), b = G(ex.seg + 1);
    const ax = ex.side === "left" ? a.x0 : a.x1, bx = ex.side === "left" ? b.x0 : b.x1;
    const x = Math.min(lerp(ax, bx, .12), lerp(ax, bx, .88)), w = Math.abs(lerp(ax, bx, .76));
    return { x, y: lerp(a.y0, b.y0, .5), w, h: lerp(a.y1, b.y1, .5) - lerp(a.y0, b.y0, .5) };
  }
  const e = G(2), w = e.x1 - e.x0, h = e.y1 - e.y0;
  if (ex.side === "archL") return { x: e.x0 + w * .08, y: e.y0 + h * .28, w: w * .40, h: h * .72 };
  if (ex.side === "archR") return { x: e.x0 + w * .52, y: e.y0 + h * .28, w: w * .40, h: h * .72 };
  if (ex.side === "pfront") return { x: CW * .38, y: CH * .28, w: CW * .24, h: CH * .42 };
  if (ex.side === "pleft") return { x: CW * .04, y: CH * .3, w: CW * .2, h: CH * .5 };
  const b = G(1.4), dw = (b.x1 - b.x0) * .2, dh = (b.y1 - b.y0) * .7;
  if (ex.side === "dfront") return { x: CX - dw / 2, y: b.y1 - dh, w: dw, h: dh * .5 };
  if (ex.side === "dleft") return { x: CW * .02, y: CH * .38, w: CW * .1, h: CH * .5 };
  if (ex.side === "dright") return { x: CW * .88, y: CH * .38, w: CW * .1, h: CH * .5 };
}

/* ---------------- game actions ---------------- */
function enter(id, how) {
  S.prev = S.node; S.node = id; S.moves++;
  const n = NODES[id];
  const ext = n.kind === "pillars" ? 20 : n.kind === "arches" ? 25 : 12;
  spend(ext, { water: 4, food: 2, rest: 3, mind: n.calm ? -12 : 3 });
  S.visited[id] = S.moves;
  if (how) say(how);
  say(tx(n.enter), n.calm ? "calm" : "");
  if (S.moves >= 3 && !S.flags.noise && !n.calm && id !== "manila_near") {
    S.flags.noise = 1;
    say(tx(L("嗡嗡聲突然變得很刺耳，耳朵開始發痛。", "The hum suddenly spikes, painfully loud.")), "bad");
    S.choices = [
      { t: L("摀住耳朵，快走", "Cover your ears, keep moving"), f: () => { spend(10); say(tx(L("你摀著耳朵走了一段，聲音慢慢退了。", "You walk on with your ears covered until it recedes."))); } },
      { t: L("不管它，繼續看", "Ignore it, keep looking"), f: () => { S.conds.push("hear"); say(tx(L("聲音退去後，你的耳朵還在嗡嗡作響。聽什麼都隔了一層。", "When it passes your ears still ring. Everything sounds muffled.")), "bad"); } }
    ];
    if (S.inv.includes("plug")) S.choices.unshift({ t: L("戴上耳塞", "Put in earplugs"), f: () => { say(tx(L("你戴上耳塞。世界一下子安靜了。", "You put in the earplugs. The world goes quiet."))); } });
  } else S.choices = [];
  S.sheet = null; S.targeting = null;
  render();
}
function turnAround() {
  const n = NODES[S.node];
  spend(1, { mind: 2 });
  if (n.stable) { say(tx(L("你回頭看。拱門區沒有變，跟剛才一模一樣。", "You look back. The arch room hasn't changed at all."))); render(); return; }
  const pool = ["start", "fork", "pillars", "arches"].filter(k => k !== S.node);
  const to = pool[Math.floor(Math.random() * pool.length)];
  enter(to, tx(L("你回頭看。剛才走過的路……不見了。", "You look back. The way you came... is gone.")));
}
function search() {
  spend(30, { water: 3, food: 2, rest: 3, mind: 1 });
  const n = NODES[S.node];
  if (S.node === "pillars" && !S.flags.salt) { S.flags.salt = 1; S.inv.push("salt"); say(tx(L("你沿著柱子底部摸過去，找到幾顆橘色半透明的結晶。是火鹽。", "Feeling along the pillar bases you find a few translucent orange crystals. Firesalt."))); }
  else if (n.kind === "manila") say(tx(L("你把房間仔細看了一遍。桌上的紙和櫃子才是重點。", "You look the room over. The papers and the cupboard are what matter.")));
  else say(tx(L("你花了半小時翻找。地毯、牆角、天花板……什麼都沒有。", "Half an hour of searching. Carpet, corners, ceiling... nothing.")));

}
function rest() {

  else if (n.kind === "pillars") {
    say(tx(L("這裡的地毯比較乾，可以睡。要面向哪裡睡？", "The carpet is drier here; you could sleep. Which way do you face?")));
    S.choices = [
      { t: L("面向前進的方向", "Face the way you're going"), f: () => { spend(360, { water: 14, food: 10, rest: -60, mind: -6 }); say(tx(L("你醒來時，前方的柱子還在原處。至少方向沒丟。", "When you wake, the pillars ahead are where they were. At least you kept your heading."))); } },
      { t: L("隨便躺下", "Just lie down"), f: () => { spend(360, { water: 14, food: 10, rest: -60, mind: -2 }); say(tx(L("你醒來，四周的柱子排列全變了。你已經不知道自己原本要往哪走。", "You wake to a different grid of pillars. You no longer know which way you were heading.")), "bad"); } }
    ];

  else say(tx(L("地毯濕透了，這裡沒辦法躺。", "The carpet is soaked; you can't lie down here.")));

function useHot(h) {

  }

      say(tx(L("一個灰色的金屬保溫瓶，有凹痕。你拿起來搖一搖，只剩一半。", "A dented grey metal thermos. You shake it: half empty.")));
      S.choices = [
        { t: L("撿起來", "Take it"), f: () => { S.flags.bottle = 1; S.inv.push("half"); say(tx(L("你把它收進背包。", "You put it in your pack."))); } },
        { t: L("放著", "Leave it"), f: () => say(tx(L("你想起一條規則：沒裝滿的瓶子不要喝。", "You remember a rule: never drink from a bottle that isn't full."))) }
      ]; break;
    case "tile":

    case "table":

        say(tx(L("「第 13 次。柱林那邊有火鹽。別喝紅色的，不管它看起來像什麼。」", "“13th time. There's firesalt among the pillars. Don't drink the red one, whatever it looks like.”"))); }
      else say(tx(L("你又讀了一遍自己的紙條。你不記得寫過它。", "You read your own note again. You don't remember writing it.")));
      break;
    case "cupboard":

      else say(tx(L("櫃子空了。", "The cupboard is empty.")));
      break;
    case "wall": S.modal = "through"; break;
  }
  render();
}
function openTile(crow) {
  if (S.flags.tile) { say(tx(L("夾層裡已經沒東西了。", "Nothing left up there."))); render(); return; }
  S.flags.tile = 1; S.choices = [];

function drink(id) {

      <button data-sheet="bag">${u("bag")}<small>${S.inv.length} / 8</small></button>
      <button data-sheet="notes">${u("notes")}<small>&nbsp;</small></button>
      <button data-sheet="map">${u("map")}<small>&nbsp;</small></button>
      <button data-sheet="body">${u("body")}<small>&nbsp;</small></button>
    </div>
    ${S.sheet ? vSheet() : ""}
    ${S.modal === "through" ? `<div class="modal"><h2>${u("through")}</h2><p>${u("throughP")}</p><div class="row2"><button class="btn" id="mRestart">${u("restart")}</button><button class="btn primary" data-go="death">${u("seeDeath")}</button></div></div>` : ""}
  </section>`;
}
function vSheet() {
  let title = "", body = "";
  if (S.sheet === "bag") {
    title = u("bag");
    const W = S.inv.reduce((s, k) => s + ITEMS[k].w, 0);
    const slots = S.inv.map((k, i) => `<button class="slot" data-slot="${i}" aria-pressed="${S.sel === i}"><span class="n">${tx(ITEMS[k].n)}</span><span class="w">${u("w")} ${ITEMS[k].w}</span></button>`);
    while (slots.length < 8) slots.push(`<div class="slot empty"><span class="n">${u("empty")}</span></div>`);
    let det = "";
    if (S.sel != null && S.inv[S.sel]) {
      const it = ITEMS[S.inv[S.sel]];
      det = `<div class="detail"><p>${tx(it.d)}</p><div class="acts">
        ${it.drink ? `<button class="choice" id="dDrink">${u("drink")}</button>` : ""}
        ${it.target ? `<button class="choice" id="dUse">${u("use")}</button>` : ""}
        <button class="choice" disabled style="opacity:.4">${u("drop")}</button></div></div>`;
    }
    body = `<div class="kv"><span>${u("load")}</span><b>${W} / 8</b></div><div class="inv">${slots.join("")}</div>${det}`;
  } else if (S.sheet === "notes") {
    title = u("notes");
    const tabs = ["clues", "quests", "mine"].map(t => `<button role="tab" data-sub="${t}" aria-selected="${S.sub === t}">${u(t)}</button>`).join("");
    let inner = "";
    if (S.sub === "clues") {
      const cl = [[L("閃爍的牆", "The flickering wall"), L("撐得夠久，找到一面閃爍的牆，撲進去。", "Survive long enough to find a flickering wall, then throw yourself through.")],
        [L("沒裝滿的瓶子", "Bottles that aren't full"), L("不要喝。可能被人動過。", "Don't drink. Someone may have tampered with it.")]];
      if (S.flags.read) cl.push([L("你自己的紙條", "Your own note"), L("「第 13 次。柱林那邊有火鹽。別喝紅色的，不管它看起來像什麼。」", "“13th time. There's firesalt among the pillars. Don't drink the red one, whatever it looks like.”")]);
      inner = cl.map(([h, p]) => `<div class="entry"><h3>${tx(h)}</h3><p>${tx(p)}</p></div>`).join("");
    } else if (S.sub === "quests") {
      const q = [[L("離開 Level 0", "Leave Level 0"), L("找到閃爍的牆。", "Find the flickering wall."), false],
        [L("找到曼尼拉房間", "Find the Manila Room"), L("有人說，嗡嗡聲變小的地方會聽到鋼琴聲。", "They say where the hum fades, you'll hear a piano."), NODES[S.node].kind === "manila" || !!S.visited.manila_in]];
      if (S.flags.read) q.push([L("為什麼是我？", "Why me?"), L("孤立效應會抹掉所有人的筆記。為什麼你的沒有被抹掉？", "The Isolation Effect erases everyone's notes. Why not yours?"), false]);
      inner = q.map(([h, p, d]) => `<div class="entry q ${d ? "done" : ""}"><h3>${tx(h)}</h3><p>${tx(p)}</p></div>`).join("");
    } else inner = `<p class="note">${u("mineHelp")}</p><textarea id="myNote" aria-label="${u("mine")}">${esc(S.myNote)}</textarea>`;
    body = `<div class="subtabs" role="tablist">${tabs}</div>${inner}`;
  } else if (S.sheet === "map") {
    title = u("map"); body = `<canvas class="mapc" id="mapc" width="480" height="360"></canvas><p class="note">${u("mapHelp")}</p>`;
  } else if (S.sheet === "body") {
    title = u("body");
    body = ["water", "food", "rest", "mind"].map(k => `<div class="bodyrow"><span class="g">${u("g_" + k)}</span><p>${desc(k)}</p></div>`).join("")
      + (S.conds.length ? `<div class="conds">${S.conds.map(c => `<span>${tx(CONDS[c])}</span>`).join("")}</div>` : "")
      + `<p class="note">${S.lang === "zh" ? "不顯示數字。身體的感覺就是你唯一的資訊。" : "No numbers. How your body feels is all you get."}</p>`;
  }
  return `<div class="sheet-back" id="sheetBack"><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="sheet-h"><h2>${title}</h2><button id="sheetX">${u("close")}</button></div><div class="sheet-b">${body}</div></div></div>`;
}
function drawMap() {
  const cv = $("#mapc"); if (!cv) return; const c = cv.getContext("2d");
  c.fillStyle = "#e9e1c3"; c.fillRect(0, 0, 480, 360);
  c.strokeStyle = "rgba(60,50,20,.12)"; for (let x = 0; x < 480; x += 24) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 360); c.stroke(); }
  const pos = id => { const [gx, gy] = NODES[id].map; return [140 + gx * 80, 200 + gy * 70]; };
  const ids = Object.keys(S.visited);
  c.lineWidth = 2;
  ids.forEach(id => NODES[id].exits.forEach(e => { if (S.visited[e.to]) { const a = S.moves - Math.min(S.visited[id], S.visited[e.to]); c.strokeStyle = `rgba(40,30,10,${Math.max(.12, .8 - a * .15)})`; c.beginPath(); c.moveTo(...pos(id)); c.lineTo(...pos(e.to)); c.stroke(); } }));
  ids.forEach(id => {
    const n = NODES[id], age = S.moves - S.visited[id], al = n.stable ? .9 : Math.max(.1, .9 - age * .18);
    const [x, y] = pos(id);
    c.fillStyle = `rgba(40,30,10,${al})`; c.strokeStyle = `rgba(40,30,10,${al})`;
    if (n.stable) { c.strokeRect(x - 16, y - 12, 32, 24); c.beginPath(); c.arc(x, y + 2, 8, Math.PI, 0); c.stroke(); }
    else c.fillRect(x - 14, y - 10, 28, 20);
    if (id === S.node) { c.strokeStyle = "#a3341c"; c.lineWidth = 3; c.strokeRect(x - 20, y - 16, 40, 32); c.lineWidth = 2; }
  });
  c.font = "14px 'Noto Serif TC', serif"; c.fillStyle = "rgba(40,30,10,.7)";
  c.fillText(S.lang === "zh" ? "（手繪）" : "(hand-drawn)", 12, 24);
}

function screenList() { return [["title", "scrTitle"], ["prep", "scrPrep"], ["explore", "scrExplore"], ["bag", "scrBag"], ["notes", "scrNotes"], ["map", "scrMap"], ["body", "scrBody"], ["death", "scrDeath"]]; }
function render() {
  document.documentElement.lang = S.lang === "zh" ? "zh-Hant" : "en";
  $("#langBtn").textContent = S.lang === "zh" ? "EN" : "中文";
  $("#flashBtn").textContent = u(S.flash ? "flashOn" : "flashOff"); $("#flashBtn").setAttribute("aria-pressed", S.flash);
  $("#soundBtn").textContent = u(S.sound ? "soundOn" : "soundOff"); $("#soundBtn").setAttribute("aria-pressed", S.sound);
  $("[data-t=mock]").textContent = u("mock");
  const sel = $("#screenSel"); const cur = S.screen === "explore" && S.sheet ? S.sheet : S.screen;
  sel.innerHTML = screenList().map(([v, k]) => `<option value="${v}" ${v === cur ? "selected" : ""}>${u(k)}</option>`).join("");
  const main = $("#main");
  main.innerHTML = S.screen === "title" ? vTitle() : S.screen === "prep" ? vPrep() : S.screen === "death" ? vDeath() : vExplore();
  if (S.screen === "explore") {
    const g = $("#grain"); if (g) g.style.backgroundImage = `url(${grainURL()})`;
    const lg = $("#log"); if (lg) lg.scrollTop = lg.scrollHeight;
    drawMap();
  }
  animate(); audioUpdate();
}
let _grain = null;
function grainURL() {
  if (_grain) return _grain;
  const c = document.createElement("canvas"); c.width = c.height = 160; const x = c.getContext("2d"); const d = x.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return (_grain = c.toDataURL());
}
function newRun() {
  Object.assign(S, { node: "start", prev: null, moves: 0, minutes: 0, st: { water: 62, food: 48, rest: 70, mind: 74 }, conds: [], sel: null, targeting: null, visited: { start: 0 }, flags: {}, log: [], choices: [], sheet: null, modal: null });
  S.inv = Object.keys(S.picked).filter(k => S.picked[k]).concat("pad");
  say(tx(NODES.start.enter));
  say(tx(L("（樣稿提示：點畫面裡的開口就能移動。點「互動點」可以顯示所有能點的地方。）", "(Mockup tip: tap an opening in the scene to move. “Hotspots” reveals everything tappable.)")), "sys");
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-go]"); if (!t) return;
  if (t.id === "langBtn") { S.lang = S.lang === "zh" ? "en" : "zh"; return render(); }
  if (t.id === "flashBtn") { S.flash = !S.flash; return render(); }
  if (t.id === "soundBtn") { S.sound = !S.sound; if (S.sound) audioStart(); else audioStop(); return render(); }
  if (t.dataset.go) { if (t.dataset.go === "prep") S.screen = "prep"; else S.screen = t.dataset.go; S.modal = null; return render(); }
  if (t.dataset.pick) { S.picked[t.dataset.pick] = S.picked[t.dataset.pick] ? 0 : 1; return render(); }
  if (t.id === "wakeBtn") { newRun(); S.screen = "explore"; return render(); }
  if (t.dataset.exit != null) { if (S.targeting) { S.targeting = null; } const ex = NODES[S.node].exits[+t.dataset.exit]; return enter(ex.to); }
  if (t.dataset.hot != null) { const hs = NODES[S.node].hots.filter(h => !(h.id === "bottle" && S.flags.bottle)); return useHot(hs[+t.dataset.hot]); }
  if (t.dataset.choice != null) { const c = S.choices[+t.dataset.choice]; S.choices = []; c.f(); return render(); }
  if (t.id === "aBack") return turnAround();
  if (t.id === "aSearch") return search();
  if (t.id === "aRest") return rest();
  if (t.id === "aHints") { S.hints = !S.hints; return render(); }
  if (t.dataset.sheet) { S.sheet = t.dataset.sheet; S.sel = null; return render(); }
  if (t.id === "sheetX") { S.sheet = null; return render(); }
  if (t.dataset.sub) { S.sub = t.dataset.sub; return render(); }
  if (t.dataset.slot != null) { S.sel = S.sel === +t.dataset.slot ? null : +t.dataset.slot; return render(); }
  if (t.id === "dDrink") return drink(S.inv[S.sel]);
  if (t.id === "dUse") { S.targeting = S.inv[S.sel]; S.sheet = null; S.sel = null; S.hints = false; return render(); }
  if (t.id === "cancelT") { S.targeting = null; return render(); }
  if (t.id === "mRestart") { S.modal = null; S.screen = "prep"; return render(); }
});
document.addEventListener("click", e => { if (e.target.id === "sheetBack") { S.sheet = null; render(); } });
document.addEventListener("change", e => {
  if (e.target.id === "flashChk") { S.flash = e.target.checked; render(); }
  if (e.target.id === "screenSel") {
    const v = e.target.value;
    if (["bag", "notes", "map", "body"].includes(v)) { if (S.screen !== "explore") { newRun(); S.screen = "explore"; } S.sheet = v; S.sel = null; }
    else { if (v === "explore" && !S.log.length) newRun(); S.screen = v; S.sheet = null; S.modal = null; }
    render();
  }
});
document.addEventListener("input", e => { if (e.target.id === "myNote") S.myNote = e.target.value; });

render();
})();
</script>
